version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: mindpower_db
    restart: always
    environment:
      POSTGRES_USER: mindpower_user
      POSTGRES_PASSWORD: mindpower_password
      POSTGRES_DB: mindpower_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mindpower_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mindpower_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=mindpower_user
      - POSTGRES_PASSWORD=mindpower_password
      - POSTGRES_DB=mindpower_db
    depends_on:
      - db
      - redis

volumes:
  postgres_data: