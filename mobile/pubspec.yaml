name: mindpower_ai
description: "MindPower AI - AI-Powered Therapy, Wellness & Therapist Management Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0
  dio: ^5.4.1
  flutter_secure_storage: ^9.0.0
  google_fonts: ^6.1.0
  fl_chart: ^0.68.0
  intl: ^0.19.0
  uuid: ^4.3.3
  cupertino_icons: ^1.0.6
  web_socket_channel: ^3.0.3
  flutter_tts: ^4.2.5
  speech_to_text: ^7.4.0
  youtube_player_iframe: ^6.0.2
  just_audio: ^0.9.36
  flutter_local_notifications: ^17.0.0
  http: ^1.2.0
  url_launcher: ^6.2.5
  flutter_markdown: ^0.7.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/ambient.mp3